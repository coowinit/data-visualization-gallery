<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="Composite Decking 美国市场搜索量排名前 100 的关键词矩形树图，支持搜索、悬停查看与点击复制。"><title>Composite Decking Keywords | Data Visualization Gallery</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="site"><nav class="nav" aria-label="主导航"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✦</span>Data Visualization Gallery</a><div class="nav-links"><a href="decking.html" aria-current="page">Decking</a><a href="cladding.html" >Cladding</a></div></nav>
<header class="intro"><div><h1>Composite Decking</h1><p class="subtitle">美国市场 · 月搜索量 Top 100</p></div><span class="source">数据导出 · 2026-11-06</span></header>
<section class="visual-panel" aria-label="关键词矩形树图"><div class="panel-head"><div class="panel-title"><h2>关键词搜索量分布</h2><p><span id="top-count">100</span> 个关键词 <span class="meta-separator">·</span> 月搜索量合计 <strong id="top-volume">—</strong></p></div><div class="controls"><label class="search-wrap"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="keyword-search" class="search" type="search" placeholder="搜索关键词..." autocomplete="off" aria-label="搜索关键词"></label><button id="reset-search" class="clear" type="button">重置</button></div></div>
<div id="treemap" class="treemap" role="group" aria-label="关键词月搜索量矩形树图"></div><div class="panel-foot"><span class="tip">悬停查看详情 · 点击复制关键词（需要浏览器支持）</span><span id="visible-count">当前显示 100 / 100</span><span class="status" id="status" role="status" aria-live="polite"></span></div></section>
<p class="bottom-note">矩形面积按关键词月搜索量计算；数据未经主题相关性筛选，不代表网站实际流量。</p></main>
<div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"><div class="tip-keyword" id="tip-keyword"></div><div class="tip-line"></div><div class="tip-stat"><span>月搜索量</span><strong id="tip-volume"></strong></div></div>
<script src="data/decking.js"></script><script src="js/app.js"></script></body></html>
