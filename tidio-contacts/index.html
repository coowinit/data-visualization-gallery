<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="Tidio 联系人国家及地区分布矩形树图：中文展示 Top 100 国家，按联系人记录数计算面积。"><title>Tidio 联系人国家分布 | Data Visualization Gallery</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="site">
<nav class="nav" aria-label="主导航"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">✦</span>Data Visualization Gallery</a><div class="nav-links"><a href="../seo-keywords/index.html">SEO 关键词</a><a href="index.html" aria-current="page">Tidio 国家分布</a></div></nav>
<header class="intro"><div><h1>Tidio 联系人国家分布</h1><p class="subtitle">国家 / 地区 · 联系人记录数 Top 100</p></div><span class="source">数据快照 · 2026-11-06</span></header>
<section class="visual-panel" aria-label="Tidio 联系人国家分布矩形树图"><div class="panel-head"><div class="panel-title"><h2>国家 / 地区分布</h2><p><span id="top-count">100</span> 个国家或地区 <span class="meta-separator">·</span> Top 100 联系人记录 <strong id="top-volume">—</strong></p></div><div class="controls"><label class="search-wrap"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="keyword-search" class="search" type="search" placeholder="搜索国家 / 地区..." autocomplete="off" aria-label="搜索国家或地区（支持中英文）"></label><button id="reset-search" class="clear" type="button">重置</button></div></div>
<div id="treemap" class="treemap" role="group" aria-label="按联系人记录数计算面积的国家分布矩形树图"></div><div class="panel-foot"><span class="tip">悬停查看中英文名称、数量及占比 · 点击复制中文国家名</span><span id="visible-count">当前显示 100 / 100</span><span id="status" class="status" role="status" aria-live="polite"></span></div></section>
<p class="bottom-note">面积对应 Tidio 联系人记录数，并非实际询盘数；占比以有国家信息的 6,016 条记录为分母。原始 6,017 条记录中有 1 条缺少国家信息。图表仅使用匿名汇总数据。</p>
</main><div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"><div class="tip-keyword" id="tip-keyword"></div><div class="tip-en" id="tip-en"></div><div class="tip-line"></div><div class="tip-stat"><span>联系人记录数</span><strong id="tip-volume"></strong></div><div class="tip-stat tip-share"><span>占全部已标注国家记录</span><strong id="tip-share"></strong></div></div>
<script src="data/countries.js"></script><script src="js/app.js"></script></body></html>
